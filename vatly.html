<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VẬT LÝ THPT (10 - 11 - 12) - TRẦN QUỐC HIỀN</title>
    <style>
        :root {
            --primary-color: #1565C0;
            --primary-hover: #0D47A1;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --border-color: #E0E6ED;
            --accent-bg: #E3F2FD;
            --grade-10: #0288D1;
            --grade-11: #00796B;
            --grade-12: #1565C0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 920px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 30px;
            text-align: center;
            margin-top: 10px;
        }

        .year-tag {
            color: #D32F2F;
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .title-banner {
            background-color: var(--primary-color);
            color: white;
            display: inline-block;
            padding: 10px 30px;
            font-weight: bold;
            font-size: 1.35rem;
            border-radius: 8px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }

        /* Thanh chọn khối lớp */
        .grade-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .grade-tab {
            padding: 12px 26px;
            font-size: 1.05rem;
            font-weight: 700;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background-color: #FFFFFF;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grade-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .grade-tab.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.25);
        }

        /* Lưới danh sách chương học */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            animation: fadeIn 0.3s ease forwards;
        }

        @media (max-width: 650px) {
            .chapters-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 16px;
            }
            .year-tag {
                font-size: 1.8rem;
            }
            .title-banner {
                font-size: 1.05rem;
                padding: 8px 18px;
            }
            .grade-tab {
                padding: 10px 16px;
                font-size: 0.98rem;
                flex: 1;
                justify-content: center;
            }
        }

        .chapter-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 18px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            text-align: left;
            line-height: 1.4;
        }

        .chapter-card:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(21, 101, 192, 0.12);
        }

        .icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        /* Phần hiển thị danh sách bài học và đề thi */
        .exam-section {
            display: none;
            margin-top: 5px;
            text-align: left;
            animation: fadeIn 0.35s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            padding: 7px 14px;
            border-radius: 6px;
            background-color: var(--accent-bg);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #BBDEFB;
        }

        .exam-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            border-left: 5px solid var(--primary-color);
            padding-left: 12px;
            text-transform: uppercase;
        }

        /* Nhóm từng bài học */
        .lesson-group {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px dashed var(--border-color);
        }

        .lesson-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .lesson-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lesson-name.special-exam {
            color: #D32F2F;
        }

        .exam-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .exam-btn {
            background-color: #F8FAFC;
            border: 1px solid #CBD5E1;
            padding: 10px 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .exam-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .exam-btn.special-btn {
            background-color: #FFF5F5;
            border-color: #FEB2B2;
            color: #C53030;
        }

        .exam-btn.special-btn:hover {
            background-color: #D32F2F;
            color: white;
            border-color: #D32F2F;
        }
    </style>
</head>

    let currentGrade = "12";

    function selectGrade(grade) {
        currentGrade = grade;

        // Cập nhật trạng thái nút Tab
        document.querySelectorAll('.grade-tab').forEach(tab => tab.classList.remove('active'));
        document.getElementById('tab-' + grade).classList.add('active');

        // Cập nhật tiêu đề banner
        const gradeObj = allPhysicsData[grade];
        document.getElementById('mainBanner').innerText = gradeObj.banner;

        // Ẩn vùng chi tiết bài học (nếu đang mở) và hiển thị lại lưới chương
        document.getElementById('examSection').style.display = 'none';
        const grid = document.getElementById('chaptersGrid');
        grid.style.display = 'grid';
        grid.innerHTML = '';

        gradeObj.chapters.forEach(chap => {
            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.onclick = () => openExamSection(chap);

            const iconSpan = document.createElement('span');
            iconSpan.className = 'icon';
            iconSpan.innerText = chap.icon;

            const titleSpan = document.createElement('span');
            titleSpan.innerText = chap.shortTitle;

            card.appendChild(iconSpan);
            card.appendChild(titleSpan);
            grid.appendChild(card);
        });
    }

    function openExamSection(chapterObj) {
        document.getElementById('chaptersGrid').style.display = 'none';
        const examSection = document.getElementById('examSection');
        examSection.style.display = 'block';

        document.getElementById('currentChapterTitle').innerText =
            "Khối " + currentGrade + " — " + chapterObj.fullTitle;

        const container = document.getElementById('lessonsContainer');
        container.innerHTML = '';

        chapterObj.lessons.forEach(item => {
            const lessonGroup = document.createElement('div');
            lessonGroup.className = 'lesson-group';

            const lessonTitle = document.createElement('div');
            lessonTitle.className = item.isSpecial ? 'lesson-name special-exam' : 'lesson-name';
            lessonTitle.innerText = (item.isSpecial ? "🔥 " : "📘 ") + item.lesson;
            lessonGroup.appendChild(lessonTitle);

            const btnGrid = document.createElement('div');
            btnGrid.className = 'exam-buttons';

            item.exams.forEach(exam => {
                const btn = document.createElement('a');
                btn.href = exam.link;
                btn.className = item.isSpecial ? 'exam-btn special-btn' : 'exam-btn';
                btn.innerText = exam.name;
                btnGrid.appendChild(btn);
            });

            lessonGroup.appendChild(btnGrid);
            container.appendChild(lessonGroup);
        });
    }

    function goBack() {
        document.getElementById('examSection').style.display = 'none';
        document.getElementById('chaptersGrid').style.display = 'grid';
    }

    // Mặc định hiển thị Khối 12 khi mở trang (có thể đổi thành '10' hoặc '11' nếu muốn)
    selectGrade('12');
